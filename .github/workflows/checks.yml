name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: pip install --require-hashes -r requirements.lock
      - run: npm run typecheck
      - run: npm test
      - run: bin/wiki validate
      - run: python3 -m compileall -q scripts tests tools
      - run: python3 tools/check-public-tree.py
      - run: docker build -f deploy/Dockerfile -t ai-topics-pi .
      - run: docker run --rm --network none --entrypoint node ai-topics-pi --test tests/runtime.test.mjs tests/sdk.test.mjs tests/tui.test.mjs
      - run: docker run --rm --network none --entrypoint /app/bin/test-collectors ai-topics-pi

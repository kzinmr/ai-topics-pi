name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: pip install --require-hashes -r requirements.lock
      - run: sudo tools/setup-linux-sandbox
      - run: npm run typecheck
      - run: npm test
      - run: bin/wiki validate
      - run: python3 -m compileall -q scripts tests tools
      - run: python3 tools/check-public-tree.py
      - run: bin/wiki --profile .local/ci-sandbox init
      - run: bin/wiki --profile .local/ci-sandbox sandbox-check

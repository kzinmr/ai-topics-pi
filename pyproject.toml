[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-topics-pi"
version = "0.1.0"
description = "Pi-only AI wiki operations"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
collectors = ["beautifulsoup4==4.14.3", "httpx==0.28.1", "readability-lxml==0.8.4.1", "PyYAML==6.0.3", "requests==2.32.5"]

[tool.setuptools.packages.find]
where = ["src"]
